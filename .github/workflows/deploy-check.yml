# After every push to main: wait for Cloudflare Pages to deploy it, and fail loudly if the live app does not report
# this commit within 10 minutes. The app's build writes /version.json ({commit, build, branch, builtAt}, never cached).
#
# On a failure it names the Pages build: with the CLOUDFLARE_API_TOKEN secret (a token with Pages: Read) and the
# CLOUDFLARE_ACCOUNT_ID variable it looks up the deployment for this commit, its stage and its build log URL;
# without them it links the project's deployment list.
name: Deploy check

on:
  push:
    branches: [main]
  workflow_dispatch:

# a newer push supersedes an older check (the older commit will never be live)
concurrency:
  group: deploy-check
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: The live app reports this commit
        env:
          APP: https://grosher.pages.dev
          WANT: ${{ github.sha }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '4dcb52828d5671d9c00edd41fa8ae457' }}
          PROJECT: grosher
        run: |
          deadline=$(( $(date +%s) + 600 ))
          live=""
          while [ "$(date +%s)" -lt "$deadline" ]; do
            live=$(curl -fsS -m 10 -H 'cache-control: no-cache' "$APP/version.json?t=$(date +%s)" 2>/dev/null | jq -r '.commit // empty' || true)
            if [ "$live" = "$WANT" ]; then
              echo "live: $APP serves $WANT ($(( 600 - (deadline - $(date +%s)) )) s after the check started)"
              exit 0
            fi
            echo "waiting: live is ${live:-unknown}, want ${WANT:0:7}"
            sleep 20
          done
          build="https://dash.cloudflare.com/$CF_ACCOUNT/pages/view/$PROJECT"
          stage="(set the CLOUDFLARE_API_TOKEN secret to name the build and its stage)"
          if [ -n "$CF_TOKEN" ]; then
            d=$(curl -fsS -m 20 -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/$PROJECT/deployments?per_page=20" \
              | jq -c --arg sha "$WANT" '[.result[] | select(.deployment_trigger.metadata.commit_hash == $sha)][0] // empty' || true)
            if [ -n "$d" ]; then
              build="$build/$(echo "$d" | jq -r .id)"
              stage="stage: $(echo "$d" | jq -r '.latest_stage.name + " " + .latest_stage.status')"
            else
              stage="no Pages deployment for this commit"
            fi
          fi
          echo "::error title=Not deployed::$APP still serves ${live:-nothing readable}, not ${WANT:0:7}, 10 minutes after the push. $stage. Pages build: $build"
          exit 1
