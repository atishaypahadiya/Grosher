name = "grosher-resolver"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# The API key is a secret, never a var:  npx wrangler secret put ANTHROPIC_API_KEY
# In production set ALLOWED_ORIGIN to the web app's exact origin; "*" is for local dev only.
[vars]
ALLOWED_ORIGIN = "*"

# Per-IP rate limit: 30 resolve calls per minute. Each call is one Claude request.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 30, period = 60 }
