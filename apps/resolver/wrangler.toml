name = "grosher-resolver"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Secrets are never vars; set them with the CLI after `npx wrangler login`:
#   npx wrangler secret put OLLAMA_UPSTREAM     the Mac's Tailscale Funnel URL (https://<machine>.<tailnet>.ts.net → the gate on :11435)
#   npx wrangler secret put OLLAMA_TOKEN        the gate's token (~/.config/grosher/ollama-token)
#   npx wrangler secret put ANTHROPIC_API_KEY   only when PROVIDER = "anthropic"
# In production set ALLOWED_ORIGIN to the web app's exact origin (the Pages URL); "*" is for local dev only.
[vars]
PROVIDER = "ollama"
OLLAMA_MODEL = "qwen3:8b"
# survey mode's aisle signs (POST /sign); on the Mac: ollama pull qwen2.5vl:7b
OLLAMA_VISION_MODEL = "qwen2.5vl:7b"
ALLOWED_ORIGIN = "*"

# Per-IP rate limit: 30 resolve calls per minute. Each call is one Claude request.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# The project page's "Get notified" list (src/waitlist.ts, migrations/0001_waitlist.sql). The Turnstile secret is a
# secret: npx wrangler secret put TURNSTILE_SECRET (the widget's site key goes in public/project/index.html).
[[d1_databases]]
binding = "WAITLIST"
database_name = "grosher-waitlist"
database_id = "95772c4a-b4a3-46ae-9297-9b0754e3058e"
migrations_dir = "migrations"

# The waitlist's own per-IP limit: 5 sign-ups a minute.
[[unsafe.bindings]]
name = "WAITLIST_LIMITER"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 5, period = 60 }
